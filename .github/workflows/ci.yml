name: CI

on:
  pull_request:
    branches: [main, release]
  push:
    branches: [main, release]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build and test client
        working-directory: client
        run: |
          npm ci
          npm test
          npm run build
      - name: Restore
        shell: pwsh
        run: |
          dotnet restore Snapshot.sln --verbosity quiet *> restore.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content restore.log | Select-String -Pattern 'error|NU\d{4}|MSB\d{4}'
            exit $LASTEXITCODE
          }
      - name: Upload restore diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: restore-${{ matrix.os }}
          path: restore.log
      - name: Build
        run: dotnet build Snapshot.sln -c Release --no-restore --verbosity quiet
      - name: Test
        run: dotnet test Snapshot.sln -c Release --no-build --filter "FullyQualifiedName!~SnapshotEndToEndTests" --verbosity quiet
      - name: Pack
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          dotnet pack src/Snapshot.Protocol/Snapshot.Protocol.csproj -c Release --no-build -o artifacts/packages --verbosity quiet
          dotnet pack src/Snapshot.Playwright/Snapshot.Playwright.csproj -c Release --no-build -o artifacts/packages --verbosity quiet
          dotnet pack src/Snapshot.Cli/Snapshot.Cli.csproj -c Release --no-build -o artifacts/packages --verbosity quiet
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest'
        with:
          name: packages
          path: artifacts/packages

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore and build
        shell: pwsh
        run: |
          dotnet build Snapshot.sln -c Release --verbosity quiet *> build.log
          if ($LASTEXITCODE -ne 0) {
            Get-Content build.log | Select-String -Pattern 'error|NU\d{4}|MSB\d{4}|CS\d{4}'
            exit $LASTEXITCODE
          }
      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: end-to-end-build
          path: build.log
      - name: Install Chromium and Linux dependencies
        run: dotnet run --project src/Snapshot.Cli/Snapshot.Cli.csproj -c Release --no-build -- browser install --with-deps
      - name: Run browser tests
        env:
          SNAPSHOT_E2E: '1'
        run: dotnet test tests/Snapshot.EndToEndTests/Snapshot.EndToEndTests.csproj -c Release --no-build --verbosity quiet
