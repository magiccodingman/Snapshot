name: Publish NuGet

on:
  push:
    branches: [release]
    paths:
      - 'src/**'
      - 'eng/Versions.props'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'README.md'
      - 'LICENSE'
      - '128x128_compressed.png'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore, test, and pack
        run: |
          dotnet restore Snapshot.sln
          dotnet test Snapshot.sln -c Release --no-restore --filter "FullyQualifiedName!~SnapshotEndToEndTests"
          dotnet pack src/Snapshot.Protocol/Snapshot.Protocol.csproj -c Release --no-restore -o artifacts/packages
          dotnet pack src/Snapshot.Playwright/Snapshot.Playwright.csproj -c Release --no-restore -o artifacts/packages
          dotnet pack src/Snapshot.Cli/Snapshot.Cli.csproj -c Release --no-restore -o artifacts/packages
      - name: NuGet login using trusted publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish packages
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<SnapshotPackageVersion>\(.*\)</SnapshotPackageVersion>.*:\1:p' eng/Versions.props)"
          cli_pointer="artifacts/packages/Snapshot.Cli.${version}.nupkg"

          # Publish dependencies and RID-specific CLI packages before the top-level
          # pointer package so dotnet tool install can always resolve its platform.
          for package in artifacts/packages/*.nupkg; do
            if [[ "$package" == "$cli_pointer" ]]; then
              continue
            fi
            dotnet nuget push "$package" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

          if [[ -f "$cli_pointer" ]]; then
            dotnet nuget push "$cli_pointer" \
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          fi
