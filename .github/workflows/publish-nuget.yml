name: Publish NuGet

on:
  push:
    branches: [release]
    paths:
      - 'src/**'
      - 'eng/Versions.props'
      - 'Directory.Build.props'
      - 'Directory.Packages.props'
      - 'README.md'
      - 'LICENSE'
      - '128x128_compressed.png'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Restore and test
        run: |
          dotnet restore Snapshot.sln
          dotnet test Snapshot.sln -c Release --no-restore --filter "FullyQualifiedName!~SnapshotEndToEndTests"
      - name: Pack NuGet libraries and CLI tool
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/packages | Out-Null
          dotnet pack src/Snapshot.Protocol/Snapshot.Protocol.csproj -c Release --no-restore -o artifacts/packages
          dotnet pack src/Snapshot.Playwright/Snapshot.Playwright.csproj -c Release --no-restore -o artifacts/packages
          dotnet clean src/Snapshot.Cli/Snapshot.Cli.csproj -c Release -p:PlaywrightPlatform=none
          dotnet clean src/Snapshot.Playwright/Snapshot.Playwright.csproj -c Release -p:PlaywrightPlatform=none -p:SnapshotExcludePlaywrightLauncher=true
          dotnet pack src/Snapshot.Cli/Snapshot.Cli.csproj -c Release --no-restore -p:PlaywrightPlatform=none -p:SnapshotExcludePlaywrightLauncher=true -o artifacts/packages
      - name: Validate compact CLI package
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $package = Get-ChildItem artifacts/packages/Snapshot.Cli.*.nupkg | Select-Object -First 1
          if ($null -eq $package) {
            throw "Snapshot.Cli package was not produced."
          }

          if ($package.Length -gt 10MB) {
            throw "Snapshot.Cli package is unexpectedly large: $([Math]::Round($package.Length / 1MB, 2)) MB"
          }

          $archive = [System.IO.Compression.ZipFile]::OpenRead($package.FullName)
          try {
            $playwrightEntries = @($archive.Entries | Where-Object { $_.FullName -like '*/.playwright/*' })
            $launcherEntries = @($archive.Entries | Where-Object { $_.Name -ieq 'playwright.ps1' })
            if ($playwrightEntries.Count -gt 0) {
              throw "Snapshot.Cli unexpectedly contains bundled Playwright driver assets."
            }
            if ($launcherEntries.Count -gt 0) {
              throw "Snapshot.Cli unexpectedly contains playwright.ps1."
            }
          }
          finally {
            $archive.Dispose()
          }
      - name: Validate packed CLI installation
        shell: pwsh
        run: |
          $version = (Select-String -Path eng/Versions.props -Pattern '<SnapshotPackageVersion>(.*?)</SnapshotPackageVersion>').Matches.Groups[1].Value
          dotnet tool install Snapshot.Cli --version $version --tool-path artifacts/tool-test --add-source artifacts/packages --ignore-failed-sources
          ./artifacts/tool-test/snapshot help
      - name: NuGet login using trusted publishing
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}
      - name: Publish packages
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's:.*<SnapshotPackageVersion>\(.*\)</SnapshotPackageVersion>.*:\1:p' eng/Versions.props)"

          dotnet nuget push "artifacts/packages/Snapshot.Protocol.${version}.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

          dotnet nuget push "artifacts/packages/Snapshot.Playwright.${version}.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

          dotnet nuget push "artifacts/packages/Snapshot.Cli.${version}.nupkg" \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
